# Dependabot configuration for automated dependency updates
version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "all"

  # Enable version updates for Cargo (Rust) dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "all"
    # Group related updates together
    groups:
      # Group all Rust runtime dependencies
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Group all dev dependencies separately
      dev-dependencies:
        patterns:
          - "*"
        dependency-type: "development"
